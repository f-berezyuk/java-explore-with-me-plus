#file: noinspection SpringYamlInspection
spring:
  application:
    name: stat-server
  config:
    import: "configserver:"
  cloud:
    config:
      fail-fast: true
      retry:
        use-random-policy: true
        max-interval: 6000
      discovery:
        enabled: true
        service-id: config-server

server:
  port: 0

management:
  server:
    port: 0

eureka:
  client:
    service-url:
      default-zone: http://${eureka.instance.hostname:localhost}:${eureka.instance.port:8761}/eureka/
